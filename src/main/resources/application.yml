server:
  port: 4595
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

spring:
  datasource:
    url: jdbc:mysql://db-history:3306/history?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cadett-splitters
    password: cspwd

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/edufy-realm


jwt:
  auth:
     converter:
       resource-id:
          name: edufy-gateway-service
       principle-attribute: preferred_username

logging:
  level:
    org:
      springframework.cloud.gateway: DEBUG
      springframework.cloud.gateway.route: DEBUG
      springframework.security: DEBUG
      springframework.security.oauth2: DEBUG
      springframework.security.jwt: DEBUG
      springframework.security.oauth2.jwt: DEBUG

    root: DEBUG
    org.springframework.web: DEBUG
    se.frisk.cadettsplittershistory_edufy: DEBUG





